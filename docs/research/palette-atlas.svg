<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
<title id="title">Seven proposed editorial palette families</title>
<desc id="desc">Newsprint, ocean signal, studio amber, black catalogue, forest circuitry, warm interior and lab sheet. Each row shows a background, reading text, signal color and furniture color. Original photographs retain their colors.</desc>
